context:
  version: "2.8.3"

package:
  name: dpsprep
  version: ${{ version }}

source:
  url: https://github.com/kcroker/dpsprep/archive/refs/tags/v${{ version }}.tar.gz
  sha256: d7ed399571571a26abf3e90bb45d8001b928ca496172f489997faec8e2e0e59d

build:
  number: 0
  skip: win
  script: python -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - dpsprep = dpsprep.cli:dpsprep

requirements:
  host:
    - pip
    - python
    - uv-build >=0.10,<1
  run:
    - click >=8
    - djvulibre-python >=0.9.3
    - fpdf2 >=2.8
    - loguru >=0.7
    - pdfrw >=0.4
    - pillow >=12.2.0
    - python
    - typing_extensions >=4.5.0

tests:
  - python:
      imports:
        - dpsprep
  - script:
      - dpsprep --help
      - dpsprep --version

about:
  homepage: https://github.com/kcroker/dpsprep
  summary: DjVu to PDF converter preserving outlines and text layers
  license: GPL-3.0-or-later
  license_file: LICENSE
  repository: https://github.com/kcroker/dpsprep
  documentation: https://github.com/kcroker/dpsprep/wiki

extra:
  recipe-maintainers:
    - user202729
